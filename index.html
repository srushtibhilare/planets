<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System Simulation</title>
    <style>
        :root {
          --primary-bg: #f8f9fa;
          --primary-text: #212529;
          --control-bg: rgba(255, 255, 255, 0.92);
          --control-border: 1px solid rgba(0, 0, 0, 0.1);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
          --accent: #4361ee;
          --radius-lg: 16px;
          --radius-md: 12px;
          --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .dark-mode {
          --primary-bg: #0a0a0a;
          --primary-text: #f8f9fa;
          --control-bg: rgba(30, 30, 30, 0.92);
          --control-border: 1px solid rgba(255, 255, 255, 0.05);
          --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
          --accent: #4895ef;
        }

        body {
          margin: 0;
          overflow: hidden;
          font-family: 'Segoe UI', system-ui, sans-serif;
          background-color: var(--primary-bg);
          color: var(--primary-text);
          transition: var(--transition);
          -webkit-font-smoothing: antialiased;
        }

        #container {
          position: relative;
          width: 100vw;
          height: 100vh;
          perspective: 1000px;
        }

        #canvas {
          display: block;
          width: 100%;
          height: 100%;
          cursor: grab;
        }

        #canvas:active {
          cursor: grabbing;
        }

        #controls {
          position: absolute;
          top: 24px;
          left: 24px;
          background: var(--control-bg);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          padding: 20px;
          border-radius: var(--radius-lg);
          box-shadow: var(--shadow);
          border: var(--control-border);
          z-index: 100;
          max-width: 320px;
          transform: translateZ(30px);
          transition: var(--transition);
        }

        #controls:hover {
          box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .controls-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 16px;
        }

        .controls-title {
          margin: 0;
          font-size: 1.25rem;
          font-weight: 600;
        }

        .control-group {
          margin: 16px 0;
          padding-bottom: 8px;
          border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .dark-mode .control-group {
          border-bottom-color: rgba(255, 255, 255, 0.05);
        }

        label {
          display: block;
          margin-bottom: 8px;
          font-weight: 500;
          font-size: 0.9rem;
          color: var(--primary-text);
          opacity: 0.9;
        }

        input[type="range"] {
          width: 100%;
          height: 6px;
          -webkit-appearance: none;
          background: rgba(0, 0, 0, 0.1);
          border-radius: 3px;
          outline: none;
          margin: 10px 0;
        }

        .dark-mode input[type="range"] {
          background: rgba(255, 255, 255, 0.1);
        }

        input[type="range"]::-webkit-slider-thumb {
          -webkit-appearance: none;
          width: 18px;
          height: 18px;
          background: var(--accent);
          border-radius: 50%;
          cursor: pointer;
          transition: var(--transition);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
          transform: scale(1.1);
        }

        .speed-value {
          display: inline-block;
          min-width: 40px;
          text-align: right;
          font-family: monospace;
          font-size: 0.85rem;
        }

        .button-group {
          display: flex;
          gap: 8px;
          margin-top: 16px;
        }

        button {
          padding: 10px 16px;
          background: var(--accent);
          color: white;
          border: none;
          border-radius: var(--radius-md);
          font-weight: 500;
          cursor: pointer;
          transition: var(--transition);
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
        }

        button:hover {
          opacity: 0.9;
          transform: translateY(-1px);
        }

        button:active {
          transform: translateY(0);
        }

        button.secondary {
          background: rgba(0, 0, 0, 0.05);
          color: var(--primary-text);
        }

        .dark-mode button.secondary {
          background: rgba(255, 255, 255, 0.1);
        }

        
        @media (max-width: 768px) {
          #controls {
            max-width: 280px;
            padding: 16px;
            top: 16px;
            left: 16px;
          }
          
          .button-group {
            flex-direction: column;
          }
        }

        
        .planet-label {
          position: absolute;
          color: white;
          font-size: 0.8rem;
          background: rgba(0, 0, 0, 0.7);
          padding: 2px 6px;
          border-radius: 4px;
          pointer-events: none;
          transform: translate3d(0, 0, 50px);
          opacity: 0;
          transition: opacity 0.3s ease;
        }

       
        .loader {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          z-index: 1000;
          color: var(--primary-text);
          font-weight: 500;
        }

        
        .slider-container {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .speed-value {
          min-width: 50px;
          text-align: right;
          font-family: 'Fira Code', monospace;
          font-size: 0.85rem;
          color: var(--primary-text);
          opacity: 0.8;
        }

        
        .camera-controls {
          display: flex;
          gap: 8px;
          margin-top: 16px;
          justify-content: center;
        }

        .icon-btn {
          width: 36px;
          height: 36px;
          padding: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 50%;
          background: rgba(0, 0, 0, 0.05);
          border: none;
          cursor: pointer;
          transition: var(--transition);
        }

        .dark-mode .icon-btn {
          background: rgba(255, 255, 255, 0.1);
        }

        .icon-btn:hover {
          background: var(--accent);
          color: white;
          transform: scale(1.1);
        }

        .icon-btn svg {
          pointer-events: none;
        }

       
        [title] {
          position: relative;
        }

        [title]:hover::after {
          content: attr(title);
          position: absolute;
          bottom: 100%;
          left: 50%;
          transform: translateX(-50%);
          background: var(--primary-text);
          color: var(--primary-bg);
          padding: 4px 8px;
          border-radius: 4px;
          font-size: 0.75rem;
          white-space: nowrap;
          pointer-events: none;
          z-index: 1000;
          margin-bottom: 5px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="container">
        <div id="controls">
            <div class="controls-header">
                <h2 class="controls-title">Solar System Controls</h2>
            </div>
            
            <div class="control-group">
  <label for="speed-1">Mercury Speed</label>
  <div class="slider-container">
    <input type="range" id="speed-1" min="0" max="1" step="0.0001" value="0.8489">
    <span class="speed-value">0.8489</span>
  </div>
</div>

<div class="control-group">
  <label for="speed-2">Venus Speed</label>
  <div class="slider-container">
    <input type="range" id="speed-2" min="0" max="1" step="0.0001" value="0.8159">
    <span class="speed-value">0.8159</span>
  </div>
</div>

<div class="control-group">
  <label for="speed-3">Earth Speed</label>
  <div class="slider-container">
    <input type="range" id="speed-3" min="0" max="1" step="0.0001" value="0.8189">
    <span class="speed-value">0.8189</span>
  </div>
</div>

<div class="control-group">
  <label for="speed-4">Mars Speed</label>
  <div class="slider-container">
    <input type="range" id="speed-4" min="0" max="1" step="0.0001" value="0.8386">
    <span class="speed-value">0.8386</span>
  </div>
</div>

<div class="control-group">
  <label for="speed-5">Jupiter Speed</label>
  <div class="slider-container">
    <input type="range" id="speed-5" min="0" max="1" step="0.0001" value="0.8029">
    <span class="speed-value">0.8029</span>
  </div>
</div>

<div class="control-group">
  <label for="speed-6">Saturn Speed</label>
  <div class="slider-container">
    <input type="range" id="speed-6" min="0" max="1" step="0.0001" value="0.8099">
    <span class="speed-value">0.8099</span>
  </div>
</div>

<div class="control-group">
  <label for="speed-7">Uranus Speed</label>
  <div class="slider-container">
    <input type="range" id="speed-7" min="0" max="1" step="0.0001" value="0.8084">
    <span class="speed-value">0.8084</span>
  </div>
</div>

<div class="control-group">
  <label for="speed-8">Neptune Speed</label>
  <div class="slider-container">
    <input type="range" id="speed-8" min="0" max="1" step="0.0001" value="0.8081">
    <span class="speed-value">0.8081</span>
  </div>
</div>
            
            <div class="button-group">
                <button id="pause-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M6 4v16M18 4v16"/>
                    </svg>
                    Pause
                </button>
                <button id="reset-btn" class="secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    Reset
                </button>
                <button id="dark-mode" class="secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    Dark Mode
                </button>
            </div>
            
            <div class="camera-controls">
                <button id="zoom-in" class="icon-btn" title="Zoom In">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="16"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                </button>
                <button id="zoom-out" class="icon-btn" title="Zoom Out">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="8" y1="12" x2="16" y2="12"/>
                    </svg>
                </button>
                <button id="reset-camera" class="icon-btn" title="Reset View">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M3 12a9 9 0 0 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                </button>
            </div>
        </div>
        <canvas id="canvas"></canvas>
    </div>
    <script>
       
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        
        camera.position.z = 30;

        
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 3, 5);
        scene.add(directionalLight);

        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        
        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.1,
                transparent: true
            });

            const starsVertices = [];
            for (let i = 0; i < 10000; i++) {
                const x = (Math.random() - 0.5) * 2000;
                const y = (Math.random() - 0.5) * 2000;
                const z = (Math.random() - 0.5) * 2000;
                starsVertices.push(x, y, z);
            }

            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }

        createStars();

        
        const planets = [
            { name: 'Sun', radius: 5, color: 0xFDB813, orbitRadius: 0, speed: 0, rotationSpeed: 0.01 },
            { name: 'Mercury', radius: 0.4, color: 0xA9A9A9, orbitRadius: 8, speed: 0.04, rotationSpeed: 0.004 },
            { name: 'Venus', radius: 0.6, color: 0xE6C229, orbitRadius: 11, speed: 0.015, rotationSpeed: 0.002 },
            { name: 'Earth', radius: 0.6, color: 0x6B93D6, orbitRadius: 14, speed: 0.01, rotationSpeed: 0.02 },
            { name: 'Mars', radius: 0.5, color: 0x993D00, orbitRadius: 17, speed: 0.008, rotationSpeed: 0.018 },
            { name: 'Jupiter', radius: 1.3, color: 0xB07F35, orbitRadius: 20, speed: 0.002, rotationSpeed: 0.04 },
            { name: 'Saturn', radius: 1.1, color: 0xB08F36, orbitRadius: 25, speed: 0.0009, rotationSpeed: 0.038, hasRing: true },
            { name: 'Uranus', radius: 0.9, color: 0x4FD0E7, orbitRadius: 30, speed: 0.0004, rotationSpeed: 0.03 },
            { name: 'Neptune', radius: 0.8, color: 0x4B70DD, orbitRadius: 35, speed: 0.0001, rotationSpeed: 0.032 }
        ];

        const planetObjects = [];

        
        planets.forEach((planet, index) => {
            const geometry = new THREE.SphereGeometry(planet.radius, 32, 32);
            const material = new THREE.MeshPhongMaterial({ 
                color: planet.color,
                shininess: 10
            });
            const sphere = new THREE.Mesh(geometry, material);
            
            if (planet.hasRing) {
                const ringGeometry = new THREE.RingGeometry(planet.radius * 1.5, planet.radius * 2, 32);
                const ringMaterial = new THREE.MeshPhongMaterial({
                    color: 0xE5DCC5,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.rotation.x = Math.PI / 2;
                sphere.add(ring);
            }

            if (index === 0) {
                
                sphere.position.set(0, 0, 0);
                
                const sunGlow = new THREE.PointLight(planet.color, 1, 50);
                sphere.add(sunGlow);
            } else {
               
                sphere.position.x = planet.orbitRadius;
            }
            
            scene.add(sphere);
            planetObjects.push({
                mesh: sphere,
                data: planet,
                angle: Math.random() * Math.PI * 2
            });
            
           
            if (index > 0) {
                const orbitGeometry = new THREE.BufferGeometry();
                const orbitMaterial = new THREE.LineBasicMaterial({ color: 0x555555 });
                
                const points = [];
                const segments = 64;
                for (let i = 0; i <= segments; i++) {
                    const theta = (i / segments) * Math.PI * 2;
                    points.push(new THREE.Vector3(
                        Math.cos(theta) * planet.orbitRadius,
                        0,
                        Math.sin(theta) * planet.orbitRadius
                    ));
                }
                
                orbitGeometry.setFromPoints(points);
                const orbit = new THREE.Line(orbitGeometry, orbitMaterial);
                scene.add(orbit);
            }
        });

        const speedControls = document.querySelectorAll('input[type="range"]');
        speedControls.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const newSpeed = parseFloat(e.target.value);
                planetObjects[index + 1].data.speed = newSpeed;
                e.target.nextElementSibling.textContent = newSpeed.toFixed(4);
            });
        });

        const pauseBtn = document.getElementById('pause-btn');
        let isPaused = false;
        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.innerHTML = isPaused ? 
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>Resume' : 
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M18 4v16"/></svg>Pause';
        });

        const resetBtn = document.getElementById('reset-btn');
        resetBtn.addEventListener('click', () => {
            speedControls.forEach((input, index) => {
                const defaultSpeed = planets[index + 1].speed;
                input.value = defaultSpeed;
                planetObjects[index + 1].data.speed = defaultSpeed;
                input.nextElementSibling.textContent = defaultSpeed.toFixed(4);
            });
        });

        const darkModeBtn = document.getElementById('dark-mode');
        darkModeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            darkModeBtn.innerHTML = document.body.classList.contains('dark-mode') ? 
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>Light Mode' : 
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>Dark Mode';
        });

        document.getElementById('zoom-in').addEventListener('click', () => {
            camera.fov -= 5;
            camera.updateProjectionMatrix();
        });

        document.getElementById('zoom-out').addEventListener('click', () => {
            camera.fov += 5;
            camera.updateProjectionMatrix();
        });

        document.getElementById('reset-camera').addEventListener('click', () => {
            camera.position.set(0, 0, 30);
            camera.lookAt(0, 0, 0);
            camera.fov = 75;
            camera.updateProjectionMatrix();
            controls.reset();
        });

        function animate() {
            requestAnimationFrame(animate);
            
            if (!isPaused) {
                planetObjects.forEach((planet, index) => {
                    if (index > 0) { 
                        planet.angle += planet.data.speed;
                        planet.mesh.position.x = Math.cos(planet.angle) * planet.data.orbitRadius;
                        planet.mesh.position.z = Math.sin(planet.angle) * planet.data.orbitRadius;
                    }
                    
                    planet.mesh.rotation.y += planet.data.rotationSpeed;
                });
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

       
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
